services:
  switchly-ui:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in .env}
    container_name: switchly-ui
    ports:
      - "${HOST_PORT:?HOST_PORT must be set in .env}:${PORT:?PORT must be set in .env}"
    env_file:
      - .env
    restart: unless-stopped
